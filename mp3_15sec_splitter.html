<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MP3 15秒分割ツール</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b12;
      --panel: rgba(20, 24, 38, .82);
      --line: rgba(255, 255, 255, .11);
      --text: #f5f7ff;
      --muted: #9aa4bd;
      --cyan: #55d9ff;
      --violet: #986cff;
      --good: #62e6aa;
      --bad: #ff7d95;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(85, 217, 255, .15), transparent 32rem),
        radial-gradient(circle at 90% 80%, rgba(152, 108, 255, .18), transparent 34rem),
        var(--bg);
    }
    main { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 54px 0 80px; }
    header { margin-bottom: 26px; }
    .eyebrow { color: var(--cyan); font-size: .78rem; font-weight: 800; letter-spacing: .16em; }
    h1 { margin: 8px 0 10px; font-size: clamp(2rem, 6vw, 3.7rem); line-height: 1; letter-spacing: -.055em; }
    header p { max-width: 650px; margin: 0; color: var(--muted); line-height: 1.7; }
    .panel {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 22px 70px rgba(0, 0, 0, .3);
      backdrop-filter: blur(18px);
    }
    #dropZone {
      display: grid;
      place-items: center;
      min-height: 230px;
      padding: 26px;
      border: 1.5px dashed rgba(85, 217, 255, .4);
      border-radius: 16px;
      text-align: center;
      cursor: pointer;
      transition: .2s ease;
      background: linear-gradient(135deg, rgba(85, 217, 255, .05), rgba(152, 108, 255, .05));
    }
    #dropZone:hover, #dropZone.drag { transform: translateY(-2px); border-color: var(--cyan); background-color: rgba(85, 217, 255, .07); }
    .icon { font-size: 2.5rem; filter: drop-shadow(0 0 18px rgba(85, 217, 255, .35)); }
    .drop-title { margin: 12px 0 5px; font-size: 1.1rem; font-weight: 750; }
    .drop-sub { color: var(--muted); font-size: .9rem; }
    input[type=file] { display: none; }
    .settings { display: flex; gap: 14px; align-items: end; margin-top: 18px; flex-wrap: wrap; }
    label { display: grid; gap: 7px; color: var(--muted); font-size: .8rem; font-weight: 700; }
    input[type=number] {
      width: 130px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--text);
      background: rgba(5, 7, 13, .6);
      font: inherit;
    }
    button, .download {
      appearance: none;
      border: 0;
      border-radius: 11px;
      padding: 12px 16px;
      color: #071017;
      background: linear-gradient(135deg, var(--cyan), #83f0ff);
      font: inherit;
      font-size: .9rem;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }
    button.secondary, .download.secondary { color: var(--text); background: rgba(255, 255, 255, .08); border: 1px solid var(--line); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #status { min-height: 24px; margin: 18px 2px 0; color: var(--muted); }
    #status.good { color: var(--good); }
    #status.bad { color: var(--bad); }
    #results { display: none; margin-top: 24px; }
    .result-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; }
    .result-head h2 { margin: 0; font-size: 1.15rem; }
    .summary { color: var(--muted); font-size: .86rem; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .list { overflow: hidden; border: 1px solid var(--line); border-radius: 14px; }
    .row { display: grid; grid-template-columns: 58px minmax(0, 1fr) 94px 96px; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .row:last-child { border-bottom: 0; }
    .num { color: var(--cyan); font-variant-numeric: tabular-nums; font-weight: 800; }
    .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .duration, .size { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; font-size: .86rem; }
    .row a { justify-self: end; padding: 8px 11px; }
    .note { margin: 18px 2px 0; color: var(--muted); font-size: .78rem; line-height: 1.6; }
    @media (max-width: 640px) {
      main { width: min(100% - 20px, 920px); padding-top: 30px; }
      .panel { padding: 14px; }
      .row { grid-template-columns: 44px minmax(0, 1fr) 78px; }
      .size { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">LOCAL AUDIO TOOL</div>
      <h1>MP3を15秒ずつ分割</h1>
      <p>MP3を選ぶだけで、自動的にフレーム境界で分割します。ファイルは外部へ送信されず、すべてブラウザ内で処理されます。</p>
    </header>

    <section class="panel">
      <div id="dropZone" role="button" tabindex="0" aria-label="MP3ファイルを選択">
        <input id="fileInput" type="file" accept="audio/mpeg,.mp3">
        <div>
          <div class="icon">♫</div>
          <div class="drop-title">MP3をここへドロップ</div>
          <div class="drop-sub">またはクリックしてファイルを選択</div>
        </div>
      </div>

      <div class="settings">
        <label>分割する秒数
          <input id="seconds" type="number" value="15" min="1" max="3600" step="1">
        </label>
        <button id="rerun" class="secondary" type="button" disabled>同じファイルで再分割</button>
      </div>

      <div id="status" aria-live="polite">MP3ファイルを選択してください。</div>

      <section id="results">
        <div class="result-head">
          <div>
            <h2>分割結果</h2>
            <div id="summary" class="summary"></div>
          </div>
          <div class="actions">
            <button id="zipButton" type="button">ZIPで一括保存</button>
          </div>
        </div>
        <div id="list" class="list"></div>
      </section>

      <p class="note">音質を変えない無劣化分割です。MP3フレーム単位で区切るため、各ファイルの長さは指定秒数から数十ミリ秒程度前後する場合があります。特殊なMP3では、分割点直後にごく短いノイズが出ることがあります。</p>
    </section>
  </main>

  <script>
    'use strict';

    const $ = (id) => document.getElementById(id);
    const dropZone = $('dropZone');
    const fileInput = $('fileInput');
    const secondsInput = $('seconds');
    const rerunButton = $('rerun');
    const zipButton = $('zipButton');
    const statusEl = $('status');
    const resultsEl = $('results');
    const listEl = $('list');
    const summaryEl = $('summary');

    let sourceFile = null;
    let parts = [];
    let objectUrls = [];

    const bitrateTables = {
      '1-1': [0,32,64,96,128,160,192,224,256,288,320,352,384,416,448],
      '1-2': [0,32,48,56,64,80,96,112,128,160,192,224,256,320,384],
      '1-3': [0,32,40,48,56,64,80,96,112,128,160,192,224,256,320],
      '2-1': [0,32,48,56,64,80,96,112,128,144,160,176,192,224,256],
      '2-2': [0,8,16,24,32,40,48,56,64,80,96,112,128,144,160],
      '2-3': [0,8,16,24,32,40,48,56,64,80,96,112,128,144,160]
    };

    function frameInfo(bytes, offset) {
      if (offset + 4 > bytes.length || bytes[offset] !== 0xff || (bytes[offset + 1] & 0xe0) !== 0xe0) return null;
      const versionBits = (bytes[offset + 1] >> 3) & 3;
      const layerBits = (bytes[offset + 1] >> 1) & 3;
      const bitrateIndex = (bytes[offset + 2] >> 4) & 15;
      const sampleIndex = (bytes[offset + 2] >> 2) & 3;
      const padding = (bytes[offset + 2] >> 1) & 1;
      if (versionBits === 1 || layerBits === 0 || bitrateIndex === 0 || bitrateIndex === 15 || sampleIndex === 3) return null;

      const version = versionBits === 3 ? 1 : (versionBits === 2 ? 2 : 2.5);
      const layer = 4 - layerBits;
      const tableVersion = version === 1 ? 1 : 2;
      const bitrate = bitrateTables[`${tableVersion}-${layer}`][bitrateIndex] * 1000;
      let sampleRate = [44100, 48000, 32000][sampleIndex];
      if (version === 2) sampleRate /= 2;
      if (version === 2.5) sampleRate /= 4;

      let samplesPerFrame, length;
      if (layer === 1) {
        samplesPerFrame = 384;
        length = Math.floor((12 * bitrate / sampleRate + padding) * 4);
      } else if (layer === 2) {
        samplesPerFrame = 1152;
        length = Math.floor(144 * bitrate / sampleRate + padding);
      } else {
        samplesPerFrame = version === 1 ? 1152 : 576;
        length = Math.floor((version === 1 ? 144 : 72) * bitrate / sampleRate + padding);
      }
      if (length < 24 || offset + length > bytes.length) return null;
      return { length, duration: samplesPerFrame / sampleRate };
    }

    function id3v2End(bytes) {
      if (bytes.length < 10 || bytes[0] !== 0x49 || bytes[1] !== 0x44 || bytes[2] !== 0x33) return 0;
      const size = ((bytes[6] & 0x7f) << 21) | ((bytes[7] & 0x7f) << 14) | ((bytes[8] & 0x7f) << 7) | (bytes[9] & 0x7f);
      return Math.min(bytes.length, 10 + size + ((bytes[5] & 0x10) ? 10 : 0));
    }

    function findFirstFrame(bytes) {
      const start = id3v2End(bytes);
      const limit = Math.min(bytes.length - 4, start + 2 * 1024 * 1024);
      for (let i = start; i <= limit; i++) {
        const one = frameInfo(bytes, i);
        if (!one) continue;
        const next = frameInfo(bytes, i + one.length);
        if (next || i + one.length === bytes.length || bytes.length - (i + one.length) <= 128) return i;
      }
      return -1;
    }

    function splitMp3(bytes, targetSeconds, stem) {
      const first = findFirstFrame(bytes);
      if (first < 0) throw new Error('MP3フレームを検出できませんでした。対応しているMP3ファイルを選択してください。');

      const frames = [];
      let pos = first;
      while (pos + 4 <= bytes.length) {
        const info = frameInfo(bytes, pos);
        if (!info) break;
        frames.push({ start: pos, end: pos + info.length, duration: info.duration });
        pos += info.length;
      }
      if (!frames.length) throw new Error('音声フレームがありません。');

      const output = [];
      let groupStart = 0;
      let elapsed = 0;
      for (let i = 0; i < frames.length; i++) {
        elapsed += frames[i].duration;
        const isLast = i === frames.length - 1;
        if (elapsed >= targetSeconds || isLast) {
          const startByte = frames[groupStart].start;
          const endByte = frames[i].end;
          const index = output.length + 1;
          output.push({
            name: `${stem}_${String(index).padStart(3, '0')}.mp3`,
            bytes: bytes.slice(startByte, endByte),
            duration: elapsed
          });
          groupStart = i + 1;
          elapsed = 0;
        }
      }
      return output;
    }

    function cleanStem(name) {
      return name.replace(/\.mp3$/i, '').replace(/[\\/:*?"<>|]/g, '_') || 'audio';
    }

    function formatBytes(value) {
      if (value < 1024) return `${value} B`;
      if (value < 1024 ** 2) return `${(value / 1024).toFixed(1)} KB`;
      return `${(value / 1024 ** 2).toFixed(2)} MB`;
    }

    function revokeUrls() {
      objectUrls.forEach(URL.revokeObjectURL);
      objectUrls = [];
    }

    function renderParts() {
      revokeUrls();
      listEl.replaceChildren();
      parts.forEach((part, i) => {
        const url = URL.createObjectURL(new Blob([part.bytes], { type: 'audio/mpeg' }));
        objectUrls.push(url);
        const row = document.createElement('div');
        row.className = 'row';

        const num = document.createElement('div');
        num.className = 'num';
        num.textContent = String(i + 1).padStart(3, '0');
        const name = document.createElement('div');
        name.className = 'name';
        name.title = part.name;
        name.textContent = part.name;
        const duration = document.createElement('div');
        duration.className = 'duration';
        duration.textContent = `${part.duration.toFixed(2)} 秒`;
        const link = document.createElement('a');
        link.className = 'download secondary';
        link.href = url;
        link.download = part.name;
        link.textContent = '保存';

        row.append(num, name, duration, link);
        listEl.append(row);
      });
      const total = parts.reduce((sum, p) => sum + p.duration, 0);
      summaryEl.textContent = `${parts.length}ファイル・合計 ${total.toFixed(2)} 秒`;
      resultsEl.style.display = 'block';
    }

    async function processFile(file) {
      if (!file || (!/\.mp3$/i.test(file.name) && file.type !== 'audio/mpeg')) {
        setStatus('MP3ファイルを選択してください。', 'bad');
        return;
      }
      const targetSeconds = Number(secondsInput.value);
      if (!Number.isFinite(targetSeconds) || targetSeconds < 1 || targetSeconds > 3600) {
        setStatus('分割秒数は1〜3600の範囲で指定してください。', 'bad');
        return;
      }

      sourceFile = file;
      rerunButton.disabled = true;
      zipButton.disabled = true;
      resultsEl.style.display = 'none';
      setStatus(`「${file.name}」を解析しています…`, '');
      await new Promise(requestAnimationFrame);

      try {
        const bytes = new Uint8Array(await file.arrayBuffer());
        parts = splitMp3(bytes, targetSeconds, cleanStem(file.name));
        renderParts();
        setStatus(`${parts.length}個のMP3に分割しました。`, 'good');
      } catch (error) {
        parts = [];
        resultsEl.style.display = 'none';
        setStatus(error instanceof Error ? error.message : '分割に失敗しました。', 'bad');
      } finally {
        rerunButton.disabled = false;
        zipButton.disabled = parts.length === 0;
      }
    }

    function setStatus(message, kind) {
      statusEl.textContent = message;
      statusEl.className = kind;
    }

    function crc32(bytes) {
      let crc = 0xffffffff;
      for (let i = 0; i < bytes.length; i++) {
        crc ^= bytes[i];
        for (let j = 0; j < 8; j++) crc = (crc >>> 1) ^ (0xedb88320 & -(crc & 1));
      }
      return (crc ^ 0xffffffff) >>> 0;
    }

    function u16(n) { return new Uint8Array([n & 255, (n >>> 8) & 255]); }
    function u32(n) { return new Uint8Array([n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]); }

    function makeZip(files) {
      const encoder = new TextEncoder();
      const localParts = [];
      const centralParts = [];
      let offset = 0;
      const now = new Date();
      const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
      const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();

      for (const file of files) {
        const name = encoder.encode(file.name);
        const crc = crc32(file.bytes);
        const size = file.bytes.length;
        const localHeader = new Blob([
          u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate),
          u32(crc), u32(size), u32(size), u16(name.length), u16(0), name
        ]);
        localParts.push(localHeader, file.bytes);

        centralParts.push(new Blob([
          u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate),
          u32(crc), u32(size), u32(size), u16(name.length), u16(0), u16(0), u16(0), u16(0),
          u32(0), u32(offset), name
        ]));
        offset += localHeader.size + size;
      }

      const centralSize = centralParts.reduce((sum, part) => sum + part.size, 0);
      const end = new Blob([
        u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
        u32(centralSize), u32(offset), u16(0)
      ]);
      return new Blob([...localParts, ...centralParts, end], { type: 'application/zip' });
    }

    function downloadZip() {
      if (!parts.length || !sourceFile) return;
      setStatus('ZIPを作成しています…', '');
      zipButton.disabled = true;
      setTimeout(() => {
        try {
          const zip = makeZip(parts);
          const url = URL.createObjectURL(zip);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${cleanStem(sourceFile.name)}_split.zip`;
          document.body.append(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
          setStatus('ZIPの保存を開始しました。', 'good');
        } catch (error) {
          setStatus('ZIPの作成に失敗しました。', 'bad');
        } finally {
          zipButton.disabled = false;
        }
      }, 20);
    }

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); fileInput.click(); }
    });
    fileInput.addEventListener('change', () => processFile(fileInput.files[0]));
    rerunButton.addEventListener('click', () => sourceFile && processFile(sourceFile));
    zipButton.addEventListener('click', downloadZip);

    for (const eventName of ['dragenter', 'dragover']) {
      dropZone.addEventListener(eventName, (event) => { event.preventDefault(); dropZone.classList.add('drag'); });
    }
    for (const eventName of ['dragleave', 'drop']) {
      dropZone.addEventListener(eventName, (event) => { event.preventDefault(); dropZone.classList.remove('drag'); });
    }
    dropZone.addEventListener('drop', (event) => processFile(event.dataTransfer.files[0]));
    window.addEventListener('beforeunload', revokeUrls);
  </script>
</body>
</html>
